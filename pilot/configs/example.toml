# =============================================================================
# Пилот magnet-platform — конфигурация расчёта.
# Отредактируйте значения ниже и запустите:
#     python -m pilot.run pilot/configs/example.toml
# Результат: графики (B, температура, карта риска демага, NdFeB vs SmCo) и
# отчёт с числами в папке output. Правьте только этот файл — Python трогать не нужно.
# =============================================================================

[magnet]
# material: "ndfeb" | "smco" | "custom"
material = "custom"
# --- для material = "custom" раскомментируйте и задайте свой магнит (СИ) ---
name     = "мой магнит"
Br       = 1.49        # остаточная индукция, Тл
Hcb      = 716000.0    # коэрцитивная сила по индукции |HcB|, А/м
Hk       = 800000.0   # поле колена |Hk|, А/м  (должно быть < Hcj)
Hcj      = 876000.0   # собственная коэрцитивность |HcJ|, А/м
alpha_Br = 0.15       # темп. коэфф. по индукции, %/°C
gamma_Hc = 0.618        # темп. коэфф. по коэрцитивности, %/°C

[geometry]
box_half      = 10.0      # половина стороны квадратной расчётной области
magnet_radius = 5      # радиус магнита-диска (< box_half)

[operating]
applied_B0_x = -0.01     # приложенное фоновое поле по x, Тл (отрицательное = размагничивающее)
applied_B0_y = 0.0       # по y, Тл
heat_load    = 1.0     # объёмное тепловыделение (потери) в магните
cooling_h    = 2.0       # коэффициент конвекции на границе (Robin); больше = лучше охлаждение
T_ambient    = 20.0      # температура окружающей среды, °C

[mesh]
n = 30                   # разбиение сетки (больше = точнее и медленнее)

[output]
dir = "pilot/output"     # куда сохранять графики и отчёт
