[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magnet-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib"]

# gmsh нужен ТОЛЬКО для генерации геометрии (magcore/fem2d/machines); решатель ядра его
# не импортирует. Изолирован как опциональная зависимость — легко снять при переходе на
# собственный мешер (план: перед оптимизацией, docs/plan_full_2026-07-14.md).
# webapp — веб-постпроцессор (webapp/, его тесты); docs — сборщики .docx в docs/ (python-docx);
# dev — прогон тестов. Точные версии рабочего окружения — requirements-lock.txt.
[project.optional-dependencies]
geometry = ["gmsh"]
webapp = ["fastapi", "uvicorn", "httpx"]
docs = ["python-docx"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["magcore*"]